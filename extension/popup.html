<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mDarker Helper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 320px;
      background: #0b0f19;
      color: #f1f5f9;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .header-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-title span {
      color: #ff8c00;
    }
    .badge {
      background: rgba(255, 140, 0, 0.15);
      border: 1px solid rgba(255, 140, 0, 0.4);
      color: #ff9d00;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle-label {
      font-size: 12.5px;
      font-weight: 600;
      color: #e2e8f0;
    }
    .toggle-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #ff8c00;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
    .field-label {
      font-size: 11.5px;
      color: #94a3b8;
      margin-bottom: 5px;
      display: block;
      font-weight: 600;
    }
    .input-text {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      transition: border-color .2s;
    }
    .input-text:focus {
      border-color: #ff8c00;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }
    .stat-item {
      background: rgba(0, 0, 0, 0.25);
      padding: 8px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-num {
      font-size: 16px;
      font-weight: 800;
      color: #38bdf8;
    }
    .stat-text {
      font-size: 10.5px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      margin-bottom: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
    }
    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      background: linear-gradient(135deg, #ff4500, #ff8c00);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .footer {
      text-align: center;
      margin-top: 10px;
      font-size: 10.5px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      ⚡ mDarker <span>Helper</span>
    </div>
    <span class="badge">v1.0.0</span>
  </div>

  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Đang kiểm tra kết nối Web...</span>
  </div>

  <div class="card">
    <div class="toggle-row">
      <div>
        <div class="toggle-label">Auto Worker Hàng Đợi</div>
        <div class="toggle-sub">Tự động nhận & xử lý UID từ Web</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="workerToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <label class="field-label" for="serverInput">Máy chủ Web mDarker (API Host):</label>
    <input type="text" id="serverInput" class="input-text" value="https://minsr.vercel.app">
  </div>

  <div class="card">
    <div class="field-label">Thống kê hoạt động</div>
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-num" id="taskCount">0</div>
        <div class="stat-text">Lệnh hoàn tất</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="lastUid" style="font-size: 13px; color: #ff9d00;">--</div>
        <div class="stat-text">UID gần nhất</div>
      </div>
    </div>
  </div>

  <button type="button" class="btn" id="checkBtn">Kiểm tra kết nối máy chủ</button>

  <div class="footer">
    mDarker 2-Way Extension Bridge · 2026
  </div>

  <script src="popup.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#ff758c" />
      <stop offset="100%" stop-color="#ff7eb3" />
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff758c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle Glow -->
  <circle cx="60" cy="60" r="50" fill="url(#cupGrad)" opacity="0.15" filter="url(#pinkGlow)" />
  
  <!-- Saucer / Plate -->
  <ellipse cx="60" cy="94" rx="38" ry="7" fill="url(#cupGrad)" opacity="0.8" />
  <ellipse cx="60" cy="93" rx="34" ry="5" fill="#ffffff" opacity="0.3" />

  <!-- Cup Body -->
  <path d="M30 46 L36 86 C37 91, 83 91, 84 86 L90 46 Z" fill="url(#cupGrad)" filter="url(#pinkGlow)" />
  <path d="M32 48 L37 84 C39 88, 81 88, 83 84 L88 48 Z" fill="#2d0b2e" opacity="0.4" />

  <!-- Heart on Cup -->
  <path d="M60 69 C60 69, 50 62, 50 56 C50 51, 55 49, 58 52 C60 54, 60 54, 60 54 C60 54, 60 54, 62 52 C65 49, 70 51, 70 56 C70 62, 60 69, 60 69 Z" fill="#ffffff" />

  <!-- Cup Handle -->
  <path d="M87 52 C99 52, 101 76, 85 76" fill="none" stroke="url(#cupGrad)" stroke-width="7" stroke-linecap="round" />

  <!-- Floating Steam / Hearts -->
  <path d="M50 36 C48 30, 53 25, 51 18" fill="none" stroke="url(#steamGrad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M60 38 C62 31, 58 26, 61 17" fill="none" stroke="url(#steamGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M70 36 C72 30, 67 25, 69 19" fill="none" stroke="url(#steamGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Little Sparkles -->
  <polygon points="32,24 34,28 38,30 34,32 32,36 30,32 26,30 30,28" fill="#ffd166" />
  <polygon points="88,28 90,31 93,33 90,35 88,38 86,35 83,33 86,31" fill="#ff7eb3" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background radial glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Outer gold rim gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#fef9c3"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Inner gold body gradient -->
    <linearGradient id="goldBody" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Specular highlight gradient -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark container circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGlow)" stroke="#ca8a04" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Subtle golden sparkles -->
  <circle cx="50" cy="50" r="1.5" fill="#fef08a" opacity="0.6"/>
  <circle cx="150" cy="60" r="2" fill="#fef08a" opacity="0.8"/>
  <circle cx="140" cy="140" r="1.5" fill="#fef08a" opacity="0.7"/>
  <circle cx="60" cy="145" r="1" fill="#fef08a" opacity="0.5"/>

  <!-- Top loop / hanger ring for locket -->
  <ellipse cx="100" cy="42" rx="14" ry="12" fill="none" stroke="url(#goldRim)" stroke-width="7" filter="url(#goldGlow)"/>
  <ellipse cx="100" cy="42" rx="14" ry="12" fill="none" stroke="#fde047" stroke-width="2"/>

  <!-- Hanger connector pin -->
  <rect x="94" y="48" width="12" height="10" rx="3" fill="url(#goldRim)"/>

  <!-- Outer Heart with Glow (Shadow/Rim) -->
  <path d="M 100,70 
           C 100,70 82,48 55,54 
           C 28,60 22,92 40,118 
           C 58,144 95,168 100,172 
           C 105,168 142,144 160,118 
           C 178,92 172,60 145,54 
           C 118,48 100,70 100,70 Z" 
        fill="url(#goldRim)" filter="url(#goldGlow)"/>

  <!-- Main Heart Face (3D effect) -->
  <path d="M 100,74 
           C 100,74 84,54 60,59 
           C 36,64 30,92 46,115 
           C 62,138 95,160 100,164 
           C 105,160 138,138 154,115 
           C 170,92 164,64 140,59 
           C 116,54 100,74 100,74 Z" 
        fill="url(#goldBody)"/>

  <!-- Inner Embossed Heart line -->
  <path d="M 100,86 
           C 100,86 88,70 70,74 
           C 52,78 48,98 60,115 
           C 72,132 96,148 100,151 
           C 104,148 128,132 140,115 
           C 152,98 148,78 130,74 
           C 112,70 100,86 100,86 Z" 
        fill="none" stroke="#fef08a" stroke-width="2.5" opacity="0.75"/>

  <!-- Specular 3D Highlight curve (left lobe) -->
  <path d="M 95,78 
           C 85,62 70,62 58,68 
           C 46,74 42,90 50,105 
           C 54,92 64,80 80,78 Z" 
        fill="url(#highlight)"/>

  <!-- Hinge on right edge (Locket detail) -->
  <rect x="156" y="98" width="6" height="16" rx="2.5" fill="url(#goldRim)"/>
  <line x1="156" y1="106" x2="162" y2="106" stroke="#451a03" stroke-width="1.5"/>

  <!-- Center Keyhole / Star Accent -->
  <circle cx="100" cy="110" r="4.5" fill="#451a03" opacity="0.6"/>
  <path d="M 98,112 L 102,112 L 103,122 L 97,122 Z" fill="#451a03" opacity="0.6"/>
</svg>
